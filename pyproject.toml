[tool.black]
line-length = 200
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''


# Poetry 2.x 配置 - 需要基本的 metadata (使用 PEP 621 格式时保持最小配置)
[tool.poetry]
name = "aiecs"
version = "2.1.2"
description = "AI Execute Services - A middleware framework for AI-powered task execution and tool orchestration"
authors = ["AIECS Team <iretbl@gmail.com>"]
readme = "README.md"
packages = [{include = "aiecs"}]

[project]
name = "aiecs"
version = "2.1.2"
description = "AI Execute Services - A middleware framework for AI-powered task execution and tool orchestration"
authors = [
    {name = "AIECS Team", email = "iretbl@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = ["ai", "middleware", "llm", "orchestration", "async", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Framework :: Celery",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # =============================================================================
    # Core Web Framework and API Dependencies
    # =============================================================================
    "fastapi (>=0.141.0,<0.150.0)",                 # Modern, fast web framework for building APIs
    "httpx (>=0.28.1,<0.29.0)",                     # Async HTTP client for Python
    "requests (>=2.34.2,<3.0.0)",                   # Synchronous HTTP client for Python (used by ppt_tool for MCP server calls)
    "uvicorn[standard] (>=0.52.0,<0.53.0)",         # ASGI server for FastAPI and WebSocket support
    "python-dotenv (>=1.2.2,<2.0.0)",               # Environment variable management from .env files
    "pydantic (>=2.13.4,<3.0.0)",                   # Data validation and settings management
    "pydantic-settings (>=2.14.2,<3.0.0)",           # Settings management for Pydantic v2
    "cachetools (>=7.1.6,<8.0.0)",                  # Caching utilities and decorators
    "typing-extensions (>=4.16.0,<5.0.0)",          # Extended typing capabilities for older Python versions
    "aiofiles (>=25.1.0,<26.0.0)",                  # Async file operations support

    # =============================================================================
    # Task Queue and Messaging
    # =============================================================================
    "celery (>=5.6.3,<6.0.0)",                      # Distributed task queue for background processing
    "redis (>=8.0.1,<9.0.0)",                       # In-memory data store used as Celery broker/backend
    "python-socketio (>=5.16.3,<6.0.0)",            # WebSocket implementation for real-time communication
    "python-engineio (>=4.13.3,<5.0.0)",            # Engine.IO implementation for Socket.IO
    "tenacity (>=9.1.4,<10.0.0)",                   # Retry library with exponential backoff strategies
    "flower (>=2.0.1,<3.0.0)",                      # Web-based monitoring tool for Celery

    # =============================================================================
    # AI and LLM Services
    # =============================================================================
    "openai (>=2.50.0,<3.0.0)",                     # OpenAI API client for GPT models
    "anthropic[vertex] (>=0.120.2,<1.0.0)",          # Anthropic API client (with Vertex AI transport) for Claude models
    "google-cloud-aiplatform (>=1.163.0,<2.0.0)",    # Transitive dependency — no longer directly imported after SDK migration to google-genai. Kept pinned because google-genai pulls it in transitively and >=1.80.0 ensures stable gRPC transport for Vertex AI.
    "google-genai (>=2.14.0,<3.0.0)",                # Google Gen AI SDK for Gemini models (replaces deprecated google-generativeai)
    "google-api-python-client (>=2.198.0,<3.0.0)",  # Google API Python Client for Custom Search
    "google-auth (>=2.56.2,<3.0.0)",                # Google authentication library
    "google-auth-httplib2 (>=0.4.0,<1.0.0)",        # HTTP transport for Google Auth
    "google-auth-oauthlib (>=1.4.0,<2.0.0)",        # OAuth 2.0 support for Google Auth

    # =============================================================================
    # Numerical / embeddings helpers
    # =============================================================================
    "numpy (>=2.5.1,<3.0.0); python_version >= '3.12'",  # 2.5.x requires Python 3.12+
    "numpy (>=2.4.6,<3.0.0); python_version < '3.12'",   # Latest numpy for Python 3.11

    # =============================================================================
    # Content Extraction / Images
    # =============================================================================
    "pillow (>=12.3.0,<13.0.0)",                    # Image processing library (PIL fork); OCR uses system tesseract

    # =============================================================================
    # Configuration and Data Formats
    # =============================================================================
    "pyyaml (>=6.0.3,<7.0.0)",                      # YAML parser and emitter

    # =============================================================================
    # Database and Storage
    # =============================================================================
    "asyncpg (>=0.31.0,<1.0.0)",                    # PostgreSQL async driver

    # =============================================================================
    # Monitoring, Metrics, and Observability
    # =============================================================================
    "prometheus-client (>=0.26.0,<1.0.0)",          # Prometheus metrics client
    "jaeger-client (>=4.8.0,<5.0.0)",               # Jaeger distributed tracing client
    "opentracing (>=2.4.0,<3.0.0)",                 # OpenTracing API for distributed tracing
]

[project.urls]
"Homepage" = "https://github.com/Howmany-Zeta/AI-Execute-Services"
"Bug Tracker" = "https://github.com/Howmany-Zeta/AI-Execute-Services/issues"
"Documentation" = "https://aiecs.readthedocs.io"

[project.optional-dependencies]
dev = [
    "psutil>=7.0.0,<8.0.0",
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "mypy>=1.18.2,<2.0.0",
    "flake8>=7.3.0,<8.0.0",
    "black>=25.1.0,<26.0.0",
    "types-aiofiles>=25.1.0.20251011",
    "types-cachetools>=7.0.0.20260201",
    "types-colorama>=0.4.15.20250801",
    "types-tqdm>=4.67.0.20250809",
    "types-pyyaml>=6.0.12.20250915",
    "types-opentracing>=2.4.10.20250622",
    "deptry>=0.23.0,<1.0.0",
]
docs = [
    "sphinx>=7.0.0,<8.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
    "sphinx-autodoc-typehints>=2.0.0,<3.0.0",
    "myst-parser>=2.0.0,<3.0.0",
    "sphinx-copybutton>=0.5.0,<1.0.0",
]
clickhouse = [
    "clickhouse-connect>=0.8.0,<1.0.0",             # Optional permanent context dual-write backend
]
temporal-graphiti = ["graphiti-core[falkordb]>=0.29.1"]
temporal-graphiti-neo4j = ["graphiti-core>=0.29.1,<0.30.0"]
host-compression = ["boto3>=1.34.0,<2.0.0"]

[project.scripts]
aiecs = "aiecs.__main__:main"
aiecs-version = "aiecs.scripts.aid.version_manager:main"
aiecs-check-modules = "aiecs.scripts.aid.module_checker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiecs*"]
exclude = ["test*", "tests*", "htmlcov*", "*.log"]

[tool.setuptools.package-data]
aiecs = ["scripts/*.md", "scripts/*.sh"]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# Pytest configuration
[tool.deptry]
pep621_dev_dependency_groups = ["dev", "docs", "host-compression"]
extend_exclude = [
    "issue_report",
    "examples",
    "test",
    "aiecs/scripts",
    # Skill demos / helpers may use optional analysis stacks (pandas, etc.)
    "aiecs/domain/agent/skills/builtin",
]
ignore = ["DEP003", "DEP004"]

[tool.deptry.per_rule_ignores]
# DEP002: packages declared for runtime/optional side-effects not visible to static import scan.
# google-auth-httplib2 / google-auth-oauthlib: Google auth transport extras.
# python-engineio: required by python-socketio.
# flower: Celery monitoring CLI (not imported by library code).
# typing-extensions: typing backport used via typing / annotations.
DEP002 = [
    "typing-extensions",
    "python-engineio",
    "flower",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    # Sync HTTP client retained for optional MCP/skill integrations (not scanned under builtin skills).
    "requests",
    # Transitive Vertex transport pin; google-genai uses it without a direct aiecs import.
    "google-cloud-aiplatform",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Test discovery paths (new structure)
testpaths = [
    "test/unit",
    "test/integration", 
    "test/e2e",
    "test/performance",
    "tests/contract",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--timeout=300",              # Default timeout: 5 minutes
    "--timeout-method=thread"     # Use thread-based timeout
]
# Timeout settings by test type
timeout_func_only = true
markers = [
    # Primary test level markers (testing pyramid)
    "unit: Unit tests - fast, isolated, no external dependencies",
    "integration: Integration tests - test component interactions",
    "e2e: End-to-end tests - full workflow with real APIs",
    
    # Special test categories
    "performance: Performance tests - measure speed and resource usage",
    "slow: Slow tests - may take several seconds or minutes (deselect with '-m \"not slow\"')",
    
    # Dependency markers
    "ai_required: Tests requiring AI services (may use mocks; deselect with '-m \"not ai_required\"')",
    "requires_api: Tests requiring real API keys (OpenAI, Google, etc.)",
    "requires_redis: Tests requiring Redis connection",
    "requires_postgres: Tests requiring PostgreSQL connection",
    
    # Provider-specific markers (for E2E tests)
    "openai: Tests requiring OpenAI API",
    "google: Tests requiring Google AI API",
    "vertex: Tests requiring Vertex AI",
    "xai: Tests requiring xAI API",
    "expensive: Tests that may cost significant API credits",
    
    # Legacy markers (backward compatibility)
    "asyncio: Async tests (automatically applied by pytest-asyncio)",
    "security: Security-related tests",

    # GVR consumer contract (M-8)
    "contract: GVR consumer API contract tests (baseline + GA target)",
    "gvr_ga: GVR GA symbols not yet implemented (skipped via importorskip)",

    # Agent plugin system (Phase 2–3 parity gate, §12.1)
    "plugin_parity: Golden snapshot parity for Hybrid/LLM/Tool agents; run test/unit/domain/agent/plugins/test_plugin_parity.py -m plugin_parity",

    # L1 temporal memory (Graphiti + FalkorDB — optional, not default CI)
    "graphiti: Tests requiring graphiti-core and FalkorDB/Neo4j (deselect with '-m \"not graphiti\"')",
    # L1 temporal memory Postgres backend (optional, not default CI)
    "postgres: Tests requiring TM_POSTGRES_URL (deselect with '-m \"not postgres\"')",

    # Context compression kernel (Phase 0+)
    "compression: Context compression kernel unit tests",

    # M-D.5 grounding search phase gates (§3.9)
    "gate_p0: M-D.5 Phase 0 prep (deprecation revoke, skeleton imports)",
    "gate_p1: M-D.5 Phase 1 router foundation (no live Gemini/Grok)",
    "gate_p2: M-D.5 Phase 2 Gemini grounding",
    "gate_p3: M-D.5 Phase 3 Grok grounding",
    "gate_p4: M-D.5 Phase 4 integration (partition + cache)",
    "gate_p5: M-D.5 Phase 5 custom registry + docs",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::pytest.PytestUnknownMarkWarning"
]

[tool.mypy]
python_version = "3.11"
files = ["aiecs"]

# Error reporting
show_error_codes = true
pretty = true

# Import handling: ignore missing stubs for third-party packages
ignore_missing_imports = true

# Strictness — baseline settings suitable for a large existing codebase
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

# Do not require type annotations on every function (allow gradual adoption)
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# Exclude non-production directories
exclude = [
    "^test/",
    "^tests/",
    "^examples/",
    "^docs/",
]

[dependency-groups]
dev = [
    "pre-commit (>=4.5.1,<5.0.0)",
    "types-python-dateutil (>=2.9.0.20260408,<3.0.0.0)",
    "build (>=1.5.0,<2.0.0)"
]
